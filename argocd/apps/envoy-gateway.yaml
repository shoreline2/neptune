apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: envoy-gateway
    repoURL: oci://docker.io/envoyproxy/gateway-helm
    targetRevision: v1.10.0
    helm:
      values: |
        # Installs the Envoy Gateway and Gateway API CRDs (experimental channel)
        crds:
          enabled: true
        deployment:
          envoyGateway:
            # Chart default (256Mi request / 1Gi limit) is far above actual use.
            # The chart sets no CPU limit; don't add `cpu: null` (renders as 0).
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
