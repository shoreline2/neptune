apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.3
    helm:
      values: |
        crds:
          enabled: true
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          # Required for the HTTP-01 solver to create HTTPRoutes on the Gateway
          enableGatewayAPI: true
        # Recommended by the DuckDNS webhook for the DNS-01 self check
        dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
