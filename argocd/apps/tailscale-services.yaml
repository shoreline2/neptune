apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-services
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/shoreline2/neptune.git'
    targetRevision: HEAD
    path: k8s/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
  # The operator rewrites egress Services' externalName; a sync must not reset it
  ignoreDifferences:
    - kind: Service
      name: tyler-precision-tower-k8s
      namespace: argocd
      jsonPointers:
        - /spec/externalName
