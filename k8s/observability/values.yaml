# Sizing: requests ~1.5x observed peak, memory limits ~2-3x. No CPU limits (avoids throttling).

grafana:
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.observability.svc:3100
  admin:
    # Manually created, see docs/grafana.md
    existingSecret: grafana-admin
  # Dashboards saved in the UI live on the shared volume (created by Prometheus)
  persistence:
    enabled: true
    existingClaim: observability-data-prometheus-prometheus-kube-prometheus-prometheus-0
    subPath: grafana
  # Every pod on the shared volume must use fsGroup 2000 (Prometheus's); a
  # different fsGroup re-groups the whole volume on mount and locks others out
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
  # SQLite on a shared volume: never run two Grafana pods at once
  deploymentStrategy:
    type: Recreate
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 768Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PodMonitors/rules from every app, not just this chart's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # Home devices push metrics here (reachable only over Tailscale)
    enableRemoteWriteReceiver: true
    retention: 30d
    # Shared 150 GB volume budget: Prometheus 25, Loki 25, Tempo 25, Grafana 1 (GB)
    retentionSize: 25GB
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        metadata:
          # Shared by the observability stack (subPaths). PVC name: observability-data-prometheus-prometheus-kube-prometheus-prometheus-0
          name: observability-data
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 150Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
  admissionWebhooks:
    # Replaces the create/patch hook Jobs, which keep Argo OutOfSync
    certManager:
      enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# OKE runs these off-cluster (no endpoints); scraping them only fires *Down alerts
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
