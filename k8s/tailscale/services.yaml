# Tailnet-only access. Nothing here is reachable from the internet.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
---
# Home devices remote-write metrics to http://neptune-prometheus:9090/api/v1/write
apiVersion: v1
kind: Service
metadata:
  name: prometheus-tailnet
  namespace: observability
  annotations:
    tailscale.com/hostname: neptune-prometheus
  labels:
    tailscale.com/proxy-class: default
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: prometheus-kube-prometheus-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
# Home devices push logs to http://neptune-loki:3100/loki/api/v1/push
apiVersion: v1
kind: Service
metadata:
  name: loki-tailnet
  namespace: observability
  annotations:
    tailscale.com/hostname: neptune-loki
  labels:
    tailscale.com/proxy-class: default
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/component: single-binary
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
# Grafana UI at http://neptune-grafana
apiVersion: v1
kind: Service
metadata:
  name: grafana-tailnet
  namespace: observability
  annotations:
    tailscale.com/hostname: neptune-grafana
  labels:
    tailscale.com/proxy-class: default
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Argo CD UI at https://neptune-argocd (self-signed cert: expect a browser warning)
apiVersion: v1
kind: Service
metadata:
  name: argocd-tailnet
  namespace: argocd
  annotations:
    tailscale.com/hostname: neptune-argocd
  labels:
    tailscale.com/proxy-class: default
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
---
# Egress: Argo CD reaches tyler-precision-tower's API server proxy through here
apiVersion: v1
kind: Service
metadata:
  name: tyler-precision-tower-k8s
  namespace: argocd
  annotations:
    tailscale.com/tailnet-fqdn: tyler-precision-tower-k8s-operator.tail78f700.ts.net
    # The tailnet policy grants tag:argocd (not tag:k8s) access to the tower's API
    tailscale.com/tags: tag:argocd
  labels:
    tailscale.com/proxy-class: default
spec:
  type: ExternalName
  externalName: placeholder # the operator replaces this with its proxy's Service
  ports:
    - name: https
      port: 443
      protocol: TCP
