apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # A wildcard listener hostname does not match the apex, so each needs its own listener.
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: neptune-mgmt.duckdns.org
      tls:
        certificateRefs:
          - name: neptune-mgmt-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.neptune-mgmt.duckdns.org"
      tls:
        certificateRefs:
          - name: neptune-mgmt-tls
      allowedRoutes:
        namespaces:
          from: All
