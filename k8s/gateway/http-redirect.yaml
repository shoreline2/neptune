# Redirects all HTTP traffic to HTTPS. cert-manager's HTTP-01 challenge routes
# match a more specific path, so they still win over this redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
      sectionName: http
  hostnames:
    - neptune-mgmt.duckdns.org
    - "*.neptune-mgmt.duckdns.org"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
