apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: oci-envoy-config
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          # No image pin: the default matches the Envoy Gateway version and is
          # fully qualified (OKE's CRI-O rejects short image names).
          # Default request is 512Mi; actual use is ~25Mi
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      envoyService:
        # These must live here (not on the Gateway's metadata) to reach the
        # generated LoadBalancer Service.
        annotations:
          # Always Free: exactly one flexible LB at 10 Mbps
          service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
          # Security lists are owned by Terraform (iac/main.tf)
          service.beta.kubernetes.io/oci-load-balancer-security-list-management-mode: "None"
