# Stock nginx at https://test.neptune-mgmt.duckdns.org, kept as a smoke test
# for DNS, the load balancer, the Gateway, and TLS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-world
  namespace: test
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
      sectionName: https-wildcard
  hostnames:
    - test.neptune-mgmt.duckdns.org
  rules:
    - backendRefs:
        - name: hello-world
          port: 80
